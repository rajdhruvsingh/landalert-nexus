<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="peakGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="peakGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background rounded frame -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Mountain back peak -->
  <polygon points="36,206 100,92 168,206" fill="url(#peakGrad1)" opacity="0.85" />

  <!-- Mountain main peak -->
  <polygon points="86,206 156,68 226,206" fill="url(#peakGrad2)" />

  <!-- Main snowcap / crest -->
  <polygon points="156,68 138,106 156,98 174,108" fill="#e0f2fe" opacity="0.95" />

  <!-- Contour lines for GIS terrain -->
  <path d="M 46 188 Q 100 170 156 182 T 216 190" fill="none" stroke="#67e8f9" stroke-width="2.5" opacity="0.4" />
  <path d="M 64 164 Q 110 148 156 156 T 198 168" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.3" />

  <!-- Hazard alert indicator beacon -->
  <circle cx="128" cy="46" r="14" fill="url(#alertGrad)" />
  <circle cx="128" cy="46" r="6" fill="#fef08a" />
  <circle cx="128" cy="46" r="22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

  <!-- Ground baseline with critical warning stripe -->
  <rect x="30" y="206" width="196" height="10" rx="5" fill="#ef4444" />
</svg>
