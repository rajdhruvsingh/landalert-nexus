<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>LandAlert-Nexus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root">
      <div
        style="
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0b0f19;
          color: #f1f5f9;
          text-align: center;
          padding: 24px;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 22px;
          "
        >
          ⛰️
        </div>
        <h1
          style="
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin: 0 0 8px 0;
            font-weight: 700;
          "
        >
          LandAlert-Nexus
        </h1>
        <p
          style="
            font-size: 0.82rem;
            color: #94a3b8;
            max-width: 360px;
            margin: 0 0 24px 0;
            line-height: 1.5;
          "
        >
          North Eastern Region Landslide Early-Warning System (SIH26001)
        </p>
        <div
          style="
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
        <style>
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
  </body>
</html>
